name: CI

on:
  push:
    branches: [main, v2.1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo test --locked --manifest-path netcore/Cargo.toml
      - run: cargo build --release --locked
