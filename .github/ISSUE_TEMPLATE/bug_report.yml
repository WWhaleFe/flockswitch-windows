name: Problem report / 문제 신고
description: Something does not switch, or the button misbehaves / 전환이 안 되거나 버튼이 이상할 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! The two outputs below let us see exactly what flockswitch sees.
        아래 두 결과가 있으면 원인을 바로 찾을 수 있습니다.
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 운영체제
      options: [Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection / 연결 방식
      multiple: true
      options: [Logi Bolt receiver, Unifying receiver, Bluetooth, USB cable]
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices / 장치
      placeholder: e.g. MX Master 4 + MX Mechanical
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened / 무슨 일이 있었나요
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: list
    attributes:
      label: "`flockswitch list` output"
      description: |
        Windows: `flockswitch.exe list` in PowerShell (in the flockswitch folder).
      render: text
  - type: input
    id: version
    attributes:
      label: flockswitch version / 버전
      placeholder: shown at the bottom of the ⇄ menu, e.g. 0.3.1
