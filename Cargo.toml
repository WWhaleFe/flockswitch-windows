[package]
name = "flockswitch"
version = "1.9.0"
edition = "2021"
license = "MIT"
description = "Turn a spare Logitech mouse button into an Easy-Switch key that moves your mouse and keyboard to another computer together"
repository = "https://github.com/WWhaleFe/flockswitch-windows"
readme = "README.md"

[dependencies]
anyhow = "1"
auto-launch = "0.6.0"
ctrlc = { version = "3", features = ["termination"] }
dirs = "5"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
env_logger = "0.11"
global-hotkey = "0.9"
hidapi = "2"
log = "0.4"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
# Draws the countdown and locate effects (overlay_render.rs).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tao = "0.37.2"
toml = "0.8"
tray-icon = "0.26.1"

[profile.release]
lto = true
strip = true
opt-level = "s"

[target."cfg(windows)".dependencies]
# The Store version asks the Microsoft Store for updates (Windows.Services.Store).
windows = { version = "0.62.2", features = ["ApplicationModel", "Foundation", "Foundation_Collections", "Services_Store", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Recovery", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Windows draws the settings window with Direct3D (wgpu): many PCs (virtual machines,
# remote desktop, no vendor driver) only offer OpenGL 1.1, which egui's OpenGL renderer
# cannot use. Direct3D always has a software fallback (WARP). OpenGL stays as a backup.
# Direct3D 12 only, not Vulkan: some Intel Vulkan drivers hang (see settings_ui.rs).
eframe = { version = "0.37.0", default-features = false, features = ["wgpu"] }

[build-dependencies]
png = "0.18"
winresource = "0.1.34"

[dev-dependencies]
png = "0.18"
